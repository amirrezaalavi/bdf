name: release

# Builds the static binaries and attaches them to a GitHub release.
#
# The artifacts are built by `scripts/build-release.sh`, the SAME script used locally, so a
# locally-built binary and a released one come from one documented path. That matters because
# CANARY.md once had to withdraw a "byte-for-byte reproducible" claim for want of a recorded
# procedure (docs/reviews/2026-10-03-independent-critique-and-plan-changes.md §4.3).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish assets for"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain and both musl targets
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2

      - name: Build and verify both static binaries
        run: bash scripts/build-release.sh

      - name: Fail if either binary is missing or empty
        run: |
          set -euo pipefail
          for arch in x86_64 arm64; do
            f="dist/pdfrtl-$arch-linux-musl"
            test -s "$f" || { echo "missing or empty: $f" >&2; exit 1; }
            # An ELF header is not proof of the right architecture; read it.
            case "$arch" in
              x86_64) want="x86-64" ;;
              arm64)  want="aarch64" ;;
            esac
            file "$f" | grep -qi "$want" || { echo "wrong arch in $f" >&2; exit 1; }
            readelf -d "$f" 2>/dev/null | grep -q NEEDED && {
              echo "dynamic binary: $f" >&2; exit 1; }
          done

      - name: Upload artifacts to the workflow run
        uses: actions/upload-artifact@v4
        with:
          name: pdfrtl-linux-musl
          path: |
            dist/pdfrtl-x86_64-linux-musl
            dist/pdfrtl-arm64-linux-musl
            dist/SHA256SUMS

      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release create "$tag" \
            --title "$tag" \
            --notes "Static Linux binaries (musl, no runtime needed).

          | file | arch | size |
          |---|---|---|
          | pdfrtl-x86_64-linux-musl | x86-64 | Intel/AMD servers, desktops |
          | pdfrtl-arm64-linux-musl | aarch64 | ARM servers, Raspberry Pi, Graviton |

          Verify a download with \`sha256sum -c SHA256SUMS\`.

          Extraction returns logical (reading) order or an explicit reason - never silently
          reversed text. See CANARY.md for what it refuses and docs/CLI.md for the contract."
          dist/pdfrtl-x86_64-linux-musl \
          dist/pdfrtl-arm64-linux-musl \
          dist/SHA256SUMS