name: release

# Builds the static binaries and attaches them to a GitHub release.
#
# The artifacts are built by `scripts/build-release.sh`, the SAME script used locally, so a
# locally-built binary and a released one come from one documented path. That matters because
# CANARY.md once had to withdraw a "byte-for-byte reproducible" claim for want of a recorded
# procedure (docs/reviews/2026-10-03-independent-critique-and-plan-changes.md §4.3).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish assets for"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain and both musl targets
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2

      - name: Build and verify both static binaries
        run: bash scripts/build-release.sh

      - name: Fail if either binary is missing, wrong-arch or dynamic
        run: |
          set -euo pipefail
          for arch in x86_64 arm64; do
            f="dist/pdfrtl-$arch-linux-musl"
            test -s "$f" || { echo "missing or empty: $f" >&2; exit 1; }
            # An ELF header is not proof of the right architecture; read it.
            case "$arch" in
              x86_64) want="x86-64" ;;
              arm64)  want="aarch64" ;;
            esac
            file "$f" | grep -qi "$want" || { echo "wrong arch in $f" >&2; exit 1; }
            # `readelf -d` on a static binary prints no NEEDED lines and exits non-zero
            # (there is no dynamic section to dump), so `grep -q` finding nothing IS the
            # passing case. Written as `if ... then fail; fi` rather than
            # `cmd && fail` because under `set -e` the latter makes the loop body's last
            # exit status the grep's, and the step fails on a CORRECT binary.
            if readelf -d "$f" 2>/dev/null | grep -q NEEDED; then
              echo "dynamic binary: $f" >&2
              exit 1
            fi
            echo "ok: $f is $want and static"
          done

      - name: Upload artifacts to the workflow run
        uses: actions/upload-artifact@v4
        with:
          name: pdfrtl-linux-musl
          path: |
            dist/pdfrtl-x86_64-linux-musl
            dist/pdfrtl-arm64-linux-musl
            dist/SHA256SUMS

      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"

          # The notes go in a FILE, not a multi-line shell string. Written inline they became one
          # long quoted argument, the closing quote was lost to the backslash-escaped table pipes,
          # and the shell then ran the first asset path as a COMMAND - which is why the log shows
          # our own binary printing its usage error (runs/37130766019).
          cat > "$RUNNER_TEMP/notes.md" <<'NOTES'
          Static Linux binaries (musl, no runtime needed).

          | file | arch | runs on |
          |---|---|---|
          | `pdfrtl-x86_64-linux-musl` | x86-64 | Intel/AMD servers, desktops, most VPS |
          | `pdfrtl-arm64-linux-musl` | aarch64 | ARM servers, Raspberry Pi, AWS Graviton |

          Verify a download:

          ```
          sha256sum -c SHA256SUMS
          ```

          Extraction returns logical (reading) order, or it fails with an explicit reason. There
          is no third outcome: no silently reversed text. See `CANARY.md` for what it refuses,
          `docs/CLI.md` for the contract and `CHANGELOG.md` for the measured state.

          Licence: all rights reserved. This release is an invitation to test, not a grant.
          NOTES

          gh release create "$tag" \
            --title "$tag" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            dist/pdfrtl-x86_64-linux-musl \
            dist/pdfrtl-arm64-linux-musl \
            dist/SHA256SUMS