[package]
name = "pdfrtl-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "RTL-first PDF core: document model, text pipeline, extraction, generation"

[dependencies]
anyhow.workspace = true
serde.workspace = true
lopdf.workspace = true
unicode-normalization.workspace = true
unicode-bidi.workspace = true

[dev-dependencies]
serde_json.workspace = true

[features]
# The acceptance criteria for the order ladder's hypothesis space. Off by default because one
# of its tests is deliberately red (it specifies an outcome we do not yet produce); see the
# header of tests/hypothesis_space.rs.
hypothesis-space = []

[[test]]
name = "hypothesis_space"
required-features = ["hypothesis-space"]
