# cargo-deny configuration — the licence red line, enforced by CI.
#
# Why this file matters more than usual: pdfrtl is dual-licensed (AGPL-3.0-or-later
# PLUS a commercial licence). Granting a commercial licence requires owning the whole
# work, so we cannot accept copyleft third-party code into anything we ship — even
# though our own licence is AGPL. Hence: permissive-only allow list, hard deny below.
#
# Run: cargo deny check        (installed via: cargo install cargo-deny --locked)

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-unknown-linux-musl" },
    { triple = "aarch64-unknown-linux-musl" },
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "aarch64-apple-darwin" },
]

[advisories]
yanked = "deny"
ignore = []

[licenses]
# Permissive + weak-copyleft-per-file only. Absence is a denial:
# GPL-2.0/3.0, AGPL-3.0, LGPL-2.1/3.0, SSPL, BUSL are intentionally NOT listed.
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
    "OpenSSL",
    "FTL",
]

# Our own crates are AGPL-3.0-or-later *by design* (ADR 0001) and are `publish = false`,
# so they are exempt from the allow list. Third-party crates are not: if one of ours ever
# leaks into the graph as a dependency of something, this exemption does not cover it.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    # Copyleft that would block commercial sublicensing. Listed explicitly so a
    # reviewer sees *why* a dependency was rejected rather than just "not allowed".
    { name = "mupdf", reason = "AGPL-3.0 — cannot be sublicensed commercially" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
